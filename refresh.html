<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f5f0">
<meta http-equiv="Cache-Control" content="no-store">
<title>עדכון זמן למעגל</title>
<style>
:root{font:17px Arial,sans-serif;color:#253d36;background:#f6f5f0;color-scheme:light}body{max-width:440px;margin:15vh auto;padding:24px;line-height:1.7}h1{font-size:1.5rem;font-weight:400}p{color:#66736c}button,a{font:inherit;color:#365e4f}button{padding:12px 18px;background:#fffefa;border:1px solid #d9ddd5;border-radius:9px;cursor:pointer}a{display:inline-block;margin-top:18px}[hidden]{display:none!important}
</style>
</head>
<body>
<h1>מעדכנים את זמן למעגל</h1>
<p id="status" role="status">מורידים את הגרסה האחרונה…</p>
<p>נתוני המפגש נשמרים.</p>
<button id="retry" type="button" hidden>ניסיון נוסף</button>
<div><a href="./">חזרה למעגל</a></div>
<script>
'use strict';
const status=document.getElementById('status'),retry=document.getElementById('retry');
function waitFor(worker,states,timeout=45000){
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>finish(new Error('העדכון מתעכב. בדקו את החיבור ונסו שוב.')),timeout);
    function finish(error){clearTimeout(timer);worker.removeEventListener('statechange',changed);error?reject(error):resolve();}
    function changed(){if(states.includes(worker.state))finish();else if(worker.state==='redundant')finish(new Error('ההורדה לא הושלמה. התחברו לאינטרנט ונסו שוב.'));}
    worker.addEventListener('statechange',changed);changed();
  });
}
function workerVersion(worker){
  return new Promise((resolve,reject)=>{
    const channel=new MessageChannel();
    const timer=setTimeout(()=>finish(new Error('הגרסה הישנה עדיין פעילה. נסו שוב עם חיבור לאינטרנט.')),8000);
    function finish(error,version){clearTimeout(timer);channel.port1.close();channel.port2.close();error?reject(error):resolve(version);}
    channel.port1.onmessage=event=>finish(null,event.data?.version);
    try{worker.postMessage({type:'GET_VERSION'},[channel.port2]);}catch{finish(new Error('לא ניתן לאמת את העדכון. נסו שוב.'));}
  });
}
async function sha256(text){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text))),b=>b.toString(16).padStart(2,'0')).join('');}
async function update(){
  retry.hidden=true;
  status.textContent='מורידים את הגרסה האחרונה…';
  try{
    if(!window.isSecureContext||!('serviceWorker'in navigator))throw new Error('פתחו את קישור העדכון ב־Chrome עם חיבור לאינטרנט.');
    // This URL was never in the old worker's cache list. Unlike an index.html
    // query, it also bypasses old workers that strip all query parameters.
    const releaseUrl=new URL('release.json',location.href);
    releaseUrl.searchParams.set('check',String(Date.now()));
    const response=await fetch(releaseUrl,{cache:'no-store',signal:AbortSignal.timeout(20000)});
    if(!response.ok)throw new Error('לא ניתן להגיע לעדכון. בדקו את החיבור ונסו שוב.');
    const release=await response.json();
    if(!/^[a-f0-9]{16}$/.test(release.version)||!/^[a-f0-9]{64}$/.test(release.indexSha256))throw new Error('לא ניתן לאמת את הגרסה האחרונה. נסו שוב.');
    const registration=await navigator.serviceWorker.register(new URL('sw.js',location.href),{updateViaCache:'none'});
    await registration.update();
    const installing=registration.installing;
    if(installing)await waitFor(installing,['installed','activated']);
    const waiting=registration.waiting||(installing?.state==='installed'?installing:null);
    if(waiting){
      status.textContent='ההורדה הושלמה. מפעילים את העדכון…';
      const activated=waitFor(waiting,['activated'],20000);
      waiting.postMessage({type:'ACTIVATE_UPDATE'});
      await activated;
    }
    await navigator.serviceWorker.ready;
    const controller=navigator.serviceWorker.controller;
    if(!controller||await workerVersion(controller)!==release.version)throw new Error('העותק הפעיל עדיין אינו הגרסה האחרונה. נסו שוב.');
    // Verify the exact root navigation that will reopen the app, through the
    // controlling worker, not just a network response or a waiting download.
    const destination=new URL('./',location.href);
    const saved=await fetch(destination,{cache:'no-store',signal:AbortSignal.timeout(20000)});
    if(!saved.ok)throw new Error('לא ניתן לפתוח את העותק המעודכן. נסו שוב.');
    const html=await saved.text();
    if(!html.includes('data-circle-build="'+release.version+'"')||await sha256(html)!==release.indexSha256)throw new Error('העותק השמור עדיין אינו מעודכן. נסו שוב עם חיבור לאינטרנט.');
    location.replace(destination.href);
  }catch(error){
    status.textContent=error instanceof Error&&error.name==='Error'?error.message:'העדכון לא הושלם. בדקו את החיבור ונסו שוב. הנתונים נשמרים.';
    retry.hidden=false;
  }
}
retry.addEventListener('click',update);
void update();
</script>
</body>
</html>
